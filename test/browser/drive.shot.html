<!doctype html>
<meta charset="utf-8">
<title>Drive — staged for a screenshot</title>
<!--
  Stages the drive screen at iPhone size so it can be LOOKED AT.

  test/browser/drive.probe.html proves the buttons do the right things. It
  cannot say whether the record button reads as the obvious target, whether the
  transport row is reachable with a thumb, whether the status line is legible
  at a glance in a moving car, or whether anything collides on a short phone.
  That needs eyes, so it needs an image.

  Usage: node tools/shoot.js drive.shot.html out.png "?state=player"
  States: picker | empty | add | keys | player | recording | pending |
          words | words-recording
-->
<style>
  html, body { margin: 0; background: #000; }
  iframe { width: 100vw; height: 100vh; border: 0; display: block; }
</style>
<body>
<script>
const Q = new URLSearchParams(location.search);
const STATE = Q.get("state") || "player";
const DOC = "doc_drive_shot";
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const FRAME = 417, FPS = 44100 / 1152;
function silentMp3(sec) {
  const n = Math.round(sec * FPS), b = new Uint8Array(FRAME * n);
  for (let i = 0; i < n; i++) { const o = i * FRAME; b[o] = 0xFF; b[o+1] = 0xFB; b[o+2] = 0x90; }
  return new Blob([b], { type: "audio/mpeg" });
}

function para(i) {
  return "Paragraph " + i + " of the staged document. It is long enough that the " +
         "chunker makes real decisions about where to cut, and reads like ordinary " +
         "prose rather than filler, because a screenshot of lorem ipsum tells you " +
         "nothing about how the real thing looks.";
}

async function main() {
  const now = new Date().toISOString();
  // A handful of pages, so the picker is shown with something like a real list.
  const docs = [
    { id: DOC, title: "First-Principles Sales Thinking", icon: "", parentId: null, order: 0, createdAt: now, updatedAt: now },
    { id: DOC + "_b", title: "Notes on compounding attention", icon: "", parentId: null, order: 1, createdAt: now, updatedAt: now },
    { id: DOC + "_c", title: "Why most onboarding fails", icon: "", parentId: null, order: 2, createdAt: now, updatedAt: now },
  ];
  localStorage.setItem("folio_documents", JSON.stringify(docs));
  docs.forEach((d, n) => {
    const blocks = [{ type: "header", data: { level: 1, text: d.title } }];
    for (let i = 0; i < (n === 0 ? 40 : 12); i++) blocks.push({ type: "paragraph", data: { text: para(i) } });
    localStorage.setItem("folio_doc_" + d.id, JSON.stringify({ time: Date.now(), blocks: blocks }));
    localStorage.setItem("folio_comments_" + d.id, "[]");
    localStorage.setItem("folio_highlights_" + d.id, "[]");
    localStorage.setItem("folio_reads_" + d.id, "[]");
  });
  localStorage.removeItem("folio_drive_position");

  const f = document.createElement("iframe");
  const loaded = new Promise((r) => { f.onload = r; });
  f.src = "/drive.html";
  document.body.appendChild(f);
  await loaded;
  await wait(500);

  if (STATE === "picker") { window.__shotReady = true; return; }

  /*
   * A PHONE THAT HAS NEVER SEEN FOLIO. The first thing he will ever see on the
   * drive screen, and the one screen whose whole job is words — so it is the
   * one most worth looking at rather than asserting about.
   */
  if (STATE === "empty" || STATE === "add" || STATE === "keys") {
    const w0 = f.contentWindow, d0 = f.contentDocument;
    w0.eval("window.__Drive = Drive;");
    w0.localStorage.clear();
    w0.__Drive.init();
    await wait(300);
    if (STATE === "add") {
      d0.getElementById("drive-add-btn").click();
      d0.getElementById("drive-add-title").value = "Pricing, thought through";
      d0.getElementById("drive-add-text").value =
        "# Pricing, thought through\n\nThe price is not what it costs us. It is what it " +
        "is worth to them, minus what it would take them to get the same thing elsewhere.\n\n" +
        "- Anchor high, then take things away.\n- Never discount; change the offer.\n";
    }
    if (STATE === "keys") {
      d0.getElementById("drive-keys-btn").click();
      d0.getElementById("drive-key-speechify").value = "sk_live_nottherealone_9f3a2b";
    }
    await wait(250);
    window.__shotReady = true;
    return;
  }
  window.__shotWhy = "opening the document";

  const w = f.contentWindow, d = f.contentDocument;
  w.eval("window.__Drive = Drive; window.__Speechify = SpeechifyProvider; window.__Voice = Voice;");
  w.__Speechify.hasKey = () => true;
  w.__Speechify.keyWasRejected = () => false;
  w.__Speechify.currentVoiceId = () => "shot";
  w.__Speechify.fetchChunk = () => Promise.resolve({ blob: silentMp3(12), marks: [], url: null });
  w.__Voice.hasKey = () => true;
  w.__Voice.startRecording = () => Promise.resolve({ shot: true });
  w.__Voice.stopRecordingRaw = () => Promise.resolve(new Blob([new Uint8Array(2048)], { type: "audio/mp4" }));
  w.__Voice.isRetryable = () => true;
  w.__Voice.transcribe = () => (STATE === "pending"
    ? Promise.reject(new Error("Network error contacting Groq"))
    : Promise.resolve("A thought worth keeping."));

  d.querySelector(".drive-doc").click();

  // Let the whole document buffer, so the status line shows its settled text.
  for (let i = 0; i < 300; i++) {
    const s = w.__Drive._state();
    window.__shotWhy = "buffering " + s.ready + "/" + s.chunks + " stitched=" + s.stitched;
    if (s.chunks && s.ready === s.chunks && s.stitched === s.chunks) break;
    await wait(150);
  }
  d.getElementById("drive-play").click();
  await wait(600);
  // Park the clock somewhere that is not 0:00, so the numbers look real.
  const a = d.getElementById("drive-audio");
  if (a && isFinite(a.duration)) { a.currentTime = a.duration * 0.34; }
  await wait(400);

  if (STATE === "words" || STATE === "words-recording") {
    d.getElementById("drive-view").click();
    await wait(900);
  }
  if (STATE === "words-recording") {
    d.getElementById("drive-record").click();
    await wait(2600);
  }
  if (STATE === "recording") {
    d.getElementById("drive-record").click();
    await wait(2600);          // long enough that the counter reads 0:02
  }
  if (STATE === "pending") {
    d.getElementById("drive-record").click();
    await wait(400);
    d.getElementById("drive-record").click();
    await wait(1800);
  }
  window.__shotWhy = "staged";
  window.__shotReady = true;
}
main().catch((e) => {
  window.__shotWhy = "threw: " + (e && e.message ? e.message : e);
  window.__shotReady = true;      // shoot it anyway; a broken screen is a finding
});
</script>
