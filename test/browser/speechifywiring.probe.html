<!doctype html>
<meta charset="utf-8">
<title>Simba slots in without changing anything</title>
<!--
  The stated requirement for this feature was "make sure the functionality
  doesn't change". So the assertions that matter most here are the negative
  ones: with no Speechify key, the reader must behave exactly as it did — same
  engine, same voices, same shortcuts — and a key that is present but broken
  must never leave a document unable to read.

  No real API call is made. The point is the wiring and the fallback, and a
  live call would cost money and need a network.
-->
<div id="host"></div>
<script>
function say(m) { new Image().src = "/r?" + encodeURIComponent(String(m)) + "&_=" + Math.random(); }
function ok(name, cond, extra) { say((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  -> " + extra)); }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const DOC = "doc_simba_wiring";

async function main() {
  const now = new Date().toISOString();
  localStorage.setItem("folio_documents", JSON.stringify([
    { id: DOC, title: "Reading Test", icon: "", parentId: null, order: 0,
      createdAt: now, updatedAt: now }]));
  localStorage.setItem("folio_doc_" + DOC, JSON.stringify({ time: Date.now(), blocks: [
    { type: "paragraph", data: { text: "The first paragraph is here to be read aloud." } },
    { type: "paragraph", data: { text: "A second paragraph follows it directly." } },
  ]}));
  localStorage.setItem("folio_comments_" + DOC, "[]");
  localStorage.setItem("folio_highlights_" + DOC, "[]");
  localStorage.removeItem("folio_speechify_key");

  const f = document.createElement("iframe");
  f.style.cssText = "width:1200px;height:800px;border:0";
  const loaded = new Promise((res) => { f.onload = res; });
  f.src = "/index.html#/doc/" + DOC;
  document.getElementById("host").appendChild(f);
  await loaded;
  await wait(2500);

  const w = f.contentWindow, d = f.contentDocument;
  w.eval("window.__tts = TTS; window.__sp = SpeechifyProvider;");

  // ── The module loaded at all ──
  ok("speechify.js loaded", !!w.__sp);
  ok("it is registered as an engine",
     w.__tts.providerList().some((p) => p.id === "speechify"),
     JSON.stringify(w.__tts.providerList()));
  ok("all eight simba-3.2 voices are offered", w.__sp.voices().length === 8);

  // ── WITHOUT A KEY: nothing may change ──
  ok("with no key it reports itself unavailable", w.__sp.available() === false);
  ok("the active engine is still the system voice",
     w.__tts.providerList().find((p) => p.active).id === "webspeech",
     JSON.stringify(w.__tts.providerList().find((p) => p.active)));
  ok("asking for it anyway falls back rather than breaking",
     w.__tts.setProvider("speechify") === "webspeech");
  ok("an unknown engine name also falls back",
     w.__tts.setProvider("nonsense-engine") === "webspeech");
  ok("reading is still reported as supported", w.__tts.isSupported() === true);

  // ── The settings controls exist and are wired in BOTH entry points ──
  ok("the settings panel has a key field", !!d.getElementById("speechify-key-input"));
  ok("...a save button", !!d.getElementById("speechify-key-save-btn"));
  ok("...a test button", !!d.getElementById("speechify-key-test-btn"));
  ok("...a clear button", !!d.getElementById("speechify-key-clear-btn"));
  ok("there is NOT a second voice picker in settings",
     !d.getElementById("speechify-voice-select"));

  /*
   * THE REPORTED BUG. The reading bar's voice dropdown listed only the active
   * engine's voices, so adding a key changed nothing you could see — the good
   * voices existed with nowhere to pick them.
   */
  const vsel = () => d.getElementById("tts-voice");
  const groups = () => Array.from(vsel().querySelectorAll("optgroup")).map((g) => g.label);
  const simbaOpts = () => Array.from(vsel().querySelectorAll("optgroup"))
      .filter((g) => /Speechify/i.test(g.label))
      .reduce((n, g) => n + g.children.length, 0);

  ok("the reading bar has a voice dropdown", !!vsel());
  ok("with no key it offers no Speechify voices", simbaOpts() === 0, String(simbaOpts()));

  // ── WITH A KEY ──
  w.localStorage.setItem("folio_speechify_key", "sk_fake_key_for_wiring_test_only");
  ok("now it reports itself available", w.__sp.available() === true);
  w.__tts.reloadVoices();
  await wait(200);

  ok("all eight Simba voices appear in the SAME dropdown",
     simbaOpts() === 8, `${simbaOpts()} — groups: ${groups().join(" / ")}`);
  ok("they are grouped under the engine name",
     groups().some((g) => /Speechify/i.test(g)), groups().join(" / "));
  ok("the system voices are still offered alongside them",
     groups().length >= 1 && vsel().options.length > 8,
     `${vsel().options.length} options in ${groups().length} groups`);
  ok("each option names its engine so the handler cannot guess wrong",
     Array.from(vsel().options).every((o) => o.value.indexOf("|") !== -1),
     Array.from(vsel().options).slice(0, 2).map((o) => o.value).join(" , "));

  // Choosing a Simba voice must switch the engine, not just the label.
  const simba = Array.from(vsel().options).find((o) => o.value.startsWith("speechify|"));
  ok("a Simba voice is selectable", !!simba);
  if (simba) {
    vsel().value = simba.value;
    vsel().dispatchEvent(new w.Event("change", { bubbles: true }));
    await wait(200);
    ok("picking it switches the engine",
       w.__tts.providerList().find((p) => p.active).id === "speechify",
       JSON.stringify(w.__tts.providerList().find((p) => p.active)));
  }

  // And back again, from the same control.
  const sys = Array.from(vsel().options).find((o) => o.value.startsWith("webspeech|"));
  if (sys) {
    vsel().value = sys.value;
    vsel().dispatchEvent(new w.Event("change", { bubbles: true }));
    await wait(200);
    ok("picking a system voice switches back",
       w.__tts.providerList().find((p) => p.active).id === "webspeech");
  }

  // ── A BROKEN key must not strand the reader ──
  ok("switching back to the system voice always works",
     w.__tts.setProvider("webspeech") === "webspeech");

  // ── The contract tts.js relies on ──
  const needed = ["id", "label", "needsKey", "available", "voices", "defaultVoice", "speak"];
  ok("the provider implements the whole interface",
     needed.every((k) => w.__sp[k] !== undefined),
     needed.filter((k) => w.__sp[k] === undefined).join(","));

  // ── The measured trap, verified through the shipped module ──
  const TEXT = "Alpha 🎨 bravo charlie.";
  const map = w.__sp._codePointToUtf16Map(TEXT);
  ok("code-point offsets convert to the right UTF-16 slice",
     TEXT.slice(map[8], map[13]) === "bravo",
     JSON.stringify(TEXT.slice(map[8], map[13])));
  ok("and the naive reading really is wrong",
     TEXT.slice(8, 13) !== "bravo", JSON.stringify(TEXT.slice(8, 13)));

  /*
   * THE COST QUESTION: audio must survive a reload, or every reload re-bills.
   * Written and read back through the shipped store, with a real Blob.
   */
  ok("the provider exposes its audio store",
     typeof w.__sp.diskUsage === "function" && typeof w.__sp.clearDisk === "function");

  const before = await w.__sp.diskUsage();
  ok("the store opens and reports a size", typeof before.bytes === "number",
     JSON.stringify(before));

  // Put a record in the way acquire() does, then read it back out.
  const wrote = await new Promise((resolve) => {
    const req = w.indexedDB.open("folio-speech", 1);
    req.onsuccess = () => {
      const db = req.result;
      const st = db.transaction("audio", "readwrite").objectStore("audio");
      const blob = new w.Blob([new Uint8Array(2048)], { type: "audio/mpeg" });
      const put = st.put({ key: "probe-key", blob, marks: [{ t0: 0, t1: 9, cs: 0, ce: 4 }],
                           bytes: 2048, lastUsed: Date.now() });
      put.onsuccess = () => resolve(true);
      put.onerror = () => resolve(false);
    };
    req.onerror = () => resolve(false);
  });
  ok("audio can be written to the store", wrote === true);

  const after = await w.__sp.diskUsage();
  ok("and it is counted", after.bytes >= before.bytes + 2048,
     `${before.bytes} -> ${after.bytes}`);

  const readBack = await new Promise((resolve) => {
    const req = w.indexedDB.open("folio-speech", 1);
    req.onsuccess = () => {
      const db = req.result;
      const g = db.transaction("audio", "readonly").objectStore("audio").get("probe-key");
      g.onsuccess = () => resolve(g.result);
      g.onerror = () => resolve(null);
    };
  });
  ok("it reads back as a Blob, which is what survives a reload",
     !!readBack && readBack.blob && readBack.blob.size === 2048,
     readBack ? String(readBack.blob && readBack.blob.size) : "nothing stored");
  ok("its timings came back with it",
     !!readBack && Array.isArray(readBack.marks) && readBack.marks.length === 1);

  await w.__sp.clearDisk();
  const cleared = await w.__sp.diskUsage();
  ok("clearing the store empties it", cleared.entries === 0, JSON.stringify(cleared));

  // ── No key may ever be baked into the shipped file ──
  const src = await (await fetch("/js/speechify.js")).text();
  ok("the shipped module contains no API key", !/sk_[A-Za-z0-9]{20,}/.test(src));

  w.localStorage.removeItem("folio_speechify_key");
  say("DONE");
}
main().catch((e) => { say("FAIL harness threw -> " + e.message); say("DONE"); });
</script>
