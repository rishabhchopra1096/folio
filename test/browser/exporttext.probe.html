<!doctype html>
<meta charset="utf-8">
<title>Text documents export in full, with comments inline</title>
<!--
  REQUESTED: for a page with no video, export the whole article with each
  comment inline where it was made, labelled with the date it was written — the
  way video documents
  already export their transcript. The old export produced only a digest of
  quoted highlights, so the document itself never made it into the file.

  The second requirement was explicit: this must not destroy any existing
  comments or notes. The last assertion here compares every folio_ key before
  and after the export, byte for byte.
-->
<div id="host"></div>
<script>
function say(m) { new Image().src = "/r?" + encodeURIComponent(String(m)) + "&_=" + Math.random(); }
function ok(name, cond, extra) { say((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  -> " + extra)); }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const DOC = "doc_exporttext_1";
const P_ONE = "Earth delivers the greeting to the child.";
const P_TWO = "The first souvenir is guaranteed on arrival.";
const P_THREE = "Avatar creation happens in the first few minutes.";
const HL_ONE = "delivers the greeting";
const HL_THREE = "Avatar creation";

async function main() {
  const now = Date.now();
  const iso = (n) => new Date(now + n * 1000).toISOString();
  localStorage.setItem("folio_documents", JSON.stringify([
    { id: DOC, title: "Category 1 Opening", icon: "", parentId: null, order: 0,
      createdAt: iso(0), updatedAt: iso(0) }]));
  localStorage.setItem("folio_doc_" + DOC, JSON.stringify({ time: now, blocks: [
    { type: "header", data: { text: "Opening and premise", level: 1 } },
    { type: "paragraph", data: { text: P_ONE } },
    { type: "paragraph", data: { text: P_TWO } },
    { type: "list", data: { style: "unordered", items: ["First item", "Second item"] } },
    { type: "paragraph", data: { text: P_THREE } },
  ]}));
  localStorage.setItem("folio_comments_" + DOC, "[]");
  localStorage.setItem("folio_highlights_" + DOC, "[]");

  const f = document.createElement("iframe");
  f.style.cssText = "width:1200px;height:800px;border:0";
  const loaded = new Promise((res) => { f.onload = res; });
  f.src = "/index.html#/doc/" + DOC;
  document.getElementById("host").appendChild(f);
  await loaded;
  await wait(2500);

  const w = f.contentWindow, d = f.contentDocument;
  w.eval("window.__hl = Highlights; window.__cm = Comments;");

  function highlight(text) {
    const walker = d.createTreeWalker(d.getElementById("article"), NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const i = node.textContent.indexOf(text);
      if (i === -1) continue;
      const r = d.createRange();
      r.setStart(node, i); r.setEnd(node, i + text.length);
      return w.__hl.createHighlightFromRange(r, "yellow");
    }
    return null;
  }

  const h1 = highlight(HL_ONE);
  const h3 = highlight(HL_THREE);
  ok("two highlights were created", !!h1 && !!h3, `${h1} / ${h3}`);

  w.__cm.addComment(h1, "this is the decided bit", DOC);
  w.__cm.addComment(h3, "note about avatars", DOC);
  w.__cm.addComment(null, "a page level note", DOC);
  await wait(300);

  // A comment whose highlight no longer exists — must not be dropped.
  const cs = JSON.parse(w.localStorage.getItem("folio_comments_" + DOC));
  cs.push({ id: "cm_orphan", highlightId: "hl_gone_forever", isGeneral: false,
            text: "orphaned but still mine", createdAt: iso(50), updatedAt: iso(50) });
  w.localStorage.setItem("folio_comments_" + DOC, JSON.stringify(cs));

  // Snapshot EVERYTHING before exporting.
  const snapshot = {};
  for (let i = 0; i < w.localStorage.length; i++) {
    const k = w.localStorage.key(i);
    if (k.startsWith("folio_")) snapshot[k] = w.localStorage.getItem(k);
  }

  // Capture the file instead of downloading it.
  let captured = null;
  const realCreate = w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL = function (blob) { captured = blob; return realCreate(blob); };

  d.getElementById("comments-export").click();
  await wait(400);

  /*
   * Export now ASKS, because the two exports answer different questions and
   * neither replaces the other. Pick the full document for these assertions.
   */
  const chooser = d.querySelector(".modal.export-choice");
  ok("export offers a choice", !!chooser);
  const options = chooser ? chooser.querySelectorAll(".export-option") : [];
  ok("there are two of them", options.length === 2, String(options.length));
  ok("one is the full document",
     !!Array.from(options).find((b) => b.dataset.kind === "full"));
  ok("the other is highlights only",
     !!Array.from(options).find((b) => b.dataset.kind === "digest"));

  Array.from(options).find((b) => b.dataset.kind === "full").click();
  await wait(800);

  ok("an export file was produced", !!captured);
  const md = captured ? await captured.text() : "";

  // ── The whole article must be there ──
  ok("the heading is exported", /^# Opening and premise$/m.test(md), md.slice(0, 120));
  ok("every paragraph is exported",
     md.includes(P_ONE) && md.includes(P_TWO) && md.includes(P_THREE),
     md.slice(0, 400));
  ok("list blocks survive too", /- First item/.test(md) && /- Second item/.test(md));

  const lines = md.split("\n");
  const idxOf = (needle) => lines.findIndex((l) => l.includes(needle));

  // ── Comments inline, under the passage they belong to ──
  /*
   * THE LABEL CHANGED ON 2026-10-15 and the SHAPE AROUND IT ON 2026-10-16.
   *
   * The label used to be a bare "COMMENT", which said nothing about WHEN the
   * note was written — and a document carrying notes from three readings needs
   * exactly that to be readable. The date is computed here the same way the
   * module computes it, rather than hardcoded, so this does not start failing
   * tomorrow.
   *
   * The shape then changed because a note was a plain paragraph holding the
   * whole quoted passage: the document got printed twice and a reader had no
   * way to tell where the note ended. A note is now a fenced block — "> " on
   * every line, the label on its own header line, the passage named beneath
   * it, the thought beneath that.
   */
  const TODAY_STAMP = new Date().toLocaleDateString("en-US",
    { month: "short", day: "numeric", year: "numeric" }).toUpperCase();
  ok("comments are labelled with the day they were written",
     new RegExp("^> \\*\\*MY THOUGHT ON " + TODAY_STAMP + "\\*\\*", "m").test(md),
     lines.filter((l) => /MY THOUGHT/.test(l)).join(" | ").slice(0, 300) || md.slice(0, 300));
  ok("...and the old bare COMMENT prefix is gone", !/^COMMENT /m.test(md),
     lines.filter((l) => l.startsWith("COMMENT")).join(" | "));

  /*
   * THE FENCE, which is the whole point: a note's own words must never sit at
   * the document's level, because that is what made them indistinguishable
   * from the prose. Checked against the real file in a real browser.
   */
  const noteTexts = ["this is the decided bit", "note about avatars",
                     "a page level note", "orphaned but still mine"];
  ok("every note's words are fenced, so none can read as the document",
     noteTexts.every((t) => {
       const ls = lines.filter((l) => l.includes(t));
       return ls.length > 0 && ls.every((l) => /^\s*>/.test(l));
     }),
     noteTexts.map((t) => t + ": " +
       (lines.find((l) => l.includes(t)) || "MISSING").slice(0, 40)).join(" | "));
  ok("...while the document's own paragraphs are NOT fenced",
     [P_ONE, P_TWO, P_THREE].every((t) =>
       lines.some((l) => l === t || (l.includes(t) && !/^\s*>/.test(l)))),
     [P_ONE, P_TWO, P_THREE].map((t) =>
       (lines.find((l) => l.includes(t)) || "MISSING").slice(0, 40)).join(" | "));

  const pOne = idxOf(P_ONE), hOne = idxOf("MY THOUGHT ON " + TODAY_STAMP);
  const cOne = idxOf("this is the decided bit");
  ok("the first comment follows its own paragraph",
     pOne !== -1 && cOne !== -1 && cOne > pOne && cOne - pOne <= 6,
     `paragraph at ${pOne}, comment at ${cOne}`);
  ok("...with its header immediately after that paragraph",
     hOne !== -1 && hOne - pOne <= 2 && hOne < cOne,
     `paragraph at ${pOne}, header at ${hOne}, text at ${cOne}`);

  const pThree = idxOf(P_THREE), cThree = idxOf("note about avatars");
  ok("the third comment follows ITS paragraph, not the first",
     pThree !== -1 && cThree !== -1 && cThree > pThree && cThree - pThree <= 6,
     `paragraph at ${pThree}, comment at ${cThree}`);
  ok("and it is not filed under an earlier paragraph", cThree > idxOf(P_TWO));

  /*
   * The passage is NAMED on its own fenced line, in curly quotes. Curly
   * because 14 of 22 passages in a real export contained a straight double
   * quote of their own, which closed the old `on "<passage>"` wrapper early.
   * This passage is short, so it is printed whole rather than shortened.
   */
  ok("the quoted passage is named so you know what it refers to",
     new RegExp('^> \\*on the highlighted passage \u201C' +
                HL_ONE.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '\u201D\\*$', "m").test(md),
     lines.filter((l) => /highlighted passage/.test(l)).join(" | ").slice(0, 300));
  ok("...and the old straight-quote wrapper is gone, so a passage cannot close it",
     !/\*\* on "/.test(md),
     lines.filter((l) => / on "/.test(l)).join(" | ").slice(0, 200));

  /*
   * THE LEGEND. The cheapest half of the fix: a reader told the convention
   * before meeting the first note never has to infer it, and the count makes a
   * note lost in a copy-paste detectable.
   */
  ok("the file explains its own convention before the first note",
     /_\*\*How to read this file\.\*\*/.test(md) &&
     lines.findIndex((l) => /How to read this file/.test(l)) <
       lines.findIndex((l) => /^> \*\*MY THOUGHT/.test(l)),
     lines.slice(0, 6).join(" | ").slice(0, 300));
  ok("...and counts the notes it holds",
     /There are 4 such notes below/.test(md),
     lines.find((l) => /such note/.test(l)) || "no count line");

  // ── Nothing is silently dropped ──
  ok("the page level note is kept", md.includes("a page level note"));
  ok("the orphaned comment is kept", md.includes("orphaned but still mine"));
  ok("both are put under an unattached heading",
     /## Notes not attached to a passage/.test(md));

  // ── THE REQUIREMENT: exporting must not change stored data ──
  let changed = [];
  for (const k of Object.keys(snapshot)) {
    if (w.localStorage.getItem(k) !== snapshot[k]) changed.push(k);
  }
  for (let i = 0; i < w.localStorage.length; i++) {
    const k = w.localStorage.key(i);
    if (k.startsWith("folio_") && !(k in snapshot)) changed.push("NEW:" + k);
  }
  ok("EXPORT CHANGED NOTHING IN STORAGE", changed.length === 0, changed.join(","));

  const after = JSON.parse(w.localStorage.getItem("folio_comments_" + DOC));
  ok("all four comments still exist afterwards", after.length === 4, String(after.length));

  // ── THE OTHER OPTION: just what was marked ──
  captured = null;
  d.getElementById("comments-export").click();
  await wait(400);
  const chooser2 = d.querySelector(".modal.export-choice");
  ok("the chooser appears again", !!chooser2);
  if (chooser2) {
    Array.from(chooser2.querySelectorAll(".export-option"))
      .find((b) => b.dataset.kind === "digest").click();
    await wait(800);
  }
  const digest = captured ? await captured.text() : "";

  ok("the digest was produced", !!digest, "nothing captured");
  ok("it quotes the highlighted passage",
     digest.includes(HL_ONE), digest.slice(0, 200));
  ok("it carries the comment on that passage",
     digest.includes("this is the decided bit"));
  ok("it keeps the page-level note under its own heading",
     /## General notes/.test(digest) && digest.includes("a page level note"),
     digest.slice(0, 300));
  ok("it keeps a note whose highlight was deleted",
     digest.includes("orphaned but still mine"));
  ok("and it does NOT contain the rest of the document",
     !digest.includes(P_TWO), "P_TWO leaked into the digest");

  say("DONE");
}
main().catch((e) => { say("FAIL harness threw -> " + e.message); say("DONE"); });
</script>
