<!doctype html>
<meta charset="utf-8">
<title>Folio — a dropped Notion export shows its pictures</title>
<!--
  WHY THIS IS A BROWSER TEST AND NOT A JSDOM ONE.

  The jsdom suite proves a relative path resolves to a data URL and that a
  block of type "image" comes out of the converter. It cannot prove the one
  thing actually being asked for: that the picture APPEARS. A data URL that is
  truncated, double-encoded, or carrying a mime type the browser will not
  decode produces a perfectly well-formed image block and a broken-image icon
  on screen, and every assertion a jsdom suite can write would pass.

  So this drives the real app, hands it a real folder-shaped drop with real
  File objects in it, and then asks the browser whether the pixels decoded:
  naturalWidth > 0 is the assertion the whole feature rests on.

  It also covers the compression path, because an imported picture and a pasted
  one share one compressor and a 3MB screenshot going in uncompressed is how
  the 10MB storage ceiling gets hit on the first import.
-->
<div id="host"></div>
<script>
const R = [];
function say(m) { new Image().src = "/r?" + encodeURIComponent(String(m)) + "&_=" + Math.random(); }
function ok(name, cond, extra) { say((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  -> " + extra)); }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* A real 2x2 PNG — small enough to take the "leave it alone" path. */
const TINY_PNG = "iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAEElEQVR4nGP4z8AARAwQCgAf7gP9i18U1AAAAABJRU5ErkJggg==";

/*
 * The markdown exactly as Notion writes it: a title heading, percent-encoded
 * relative paths, and — deliberately — one picture that is NOT in the folder,
 * because a real export that has been moved around on disk has those and
 * losing the whole document over one of them would be the wrong behaviour.
 */
const MD = [
  "# Reading the Market",
  "",
  "Some opening prose.",
  "",
  "![a small diagram](Reading%20the%20Market%2024f8e1c0/Untitled.png)",
  "",
  "More prose in between.",
  "",
  "![a big screenshot](Reading%20the%20Market%2024f8e1c0/Big%20Screenshot.png)",
  "",
  "![one that moved away](Reading%20the%20Market%2024f8e1c0/Gone.png)",
  "",
  "Closing **prose**.",
  "",
].join("\n");

async function main() {
  const f = document.createElement("iframe");
  f.style.cssText = "width:1200px;height:900px;border:0";
  const loaded = new Promise((res) => { f.onload = res; });
  f.src = "/index.html#/";
  document.getElementById("host").appendChild(f);
  await loaded;
  await wait(1500);

  const w = f.contentWindow, d = f.contentDocument;

  /*
   * The app's modules are top-level `const`s in classic scripts, so they live
   * in the global lexical scope and are NOT properties of window — reaching
   * for w.SidebarUI gets undefined. eval() inside the frame runs in that same
   * scope, which is how a probe gets at them at all.
   */
  ok("the app loaded its modules", w.eval("typeof SidebarUI") === "object",
     w.eval("typeof SidebarUI"));
  ok("the folder importer is there", w.eval("typeof FolioFolderImport") === "object",
     w.eval("typeof FolioFolderImport"));
  ok("and the editor shares its compressor",
     w.eval("typeof Editor.compressImage") === "function",
     w.eval("typeof Editor.compressImage"));

  /*
   * Build the fake export INSIDE the frame, so every File and FileReader
   * belongs to the same realm the app is running in. Built out here instead,
   * the objects cross a realm boundary and what works is a Chrome detail
   * rather than something the test should depend on.
   */
  w.eval(`
    window.__probe = {};
    window.__probe.build = async function (tinyB64, md) {
      /* The small picture: a real PNG, under the 500KB passthrough threshold. */
      const tinyBytes = Uint8Array.from(atob(tinyB64), (c) => c.charCodeAt(0));
      const small = new File([tinyBytes], "Untitled.png", { type: "image/png" });

      /*
       * The big one, generated rather than embedded: random noise barely
       * compresses, so a 900x900 PNG of it lands several megabytes past the
       * threshold and forces the JPEG re-encode. Embedding a file that size in
       * this page would make the test itself a multi-megabyte download.
       */
      const cv = document.createElement("canvas");
      cv.width = 900; cv.height = 900;
      const ctx = cv.getContext("2d");
      const data = ctx.createImageData(900, 900);
      for (let i = 0; i < data.data.length; i += 4) {
        data.data[i] = (Math.random() * 255) | 0;
        data.data[i + 1] = (Math.random() * 255) | 0;
        data.data[i + 2] = (Math.random() * 255) | 0;
        data.data[i + 3] = 255;
      }
      ctx.putImageData(data, 0, 0);
      const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
      const big = new File([blob], "Big Screenshot.png", { type: "image/png" });
      window.__probe.bigBytes = big.size;

      const mdFile = new File([md], "Reading the Market 24f8e1c0.md",
                              { type: "text/markdown" });

      /*
       * A FileSystemEntry tree shaped the way a real drop of an unzipped
       * export is: the OUTER folder, so the relative paths in the markdown do
       * NOT match the walked paths directly. That is the case the three-key
       * matching exists for, and the case a test that drops the inner folder
       * would never exercise.
       */
      const fileEntry = (name, file) => ({
        isFile: true, isDirectory: false, name,
        file: (cb) => cb(file),
      });
      const dirEntry = (name, children) => ({
        isFile: false, isDirectory: true, name,
        createReader: () => {
          let done = false;
          return { readEntries: (cb) => { cb(done ? [] : children); done = true; } };
        },
      });

      window.__probe.tree = dirEntry("Export", [
        dirEntry("Reading the Market 24f8e1c0", [
          fileEntry("Untitled.png", small),
          fileEntry("Big Screenshot.png", big),
        ]),
        fileEntry("Reading the Market 24f8e1c0.md", mdFile),
      ]);
      window.__probe.lone = mdFile;
      return big.size;
    };

    window.__probe.drop = function () {
      /* What the browser hands a drop handler, in the shape it hands it. */
      const dt = { items: [{ webkitGetAsEntry: () => window.__probe.tree }], files: [] };
      return SidebarUI.handleDrop(dt);
    };

    window.__probe.dropLoneFile = function () {
      const dt = { items: [], files: [window.__probe.lone] };
      return SidebarUI.handleDrop(dt);
    };

    window.__probe.pageCount = function () {
      return (JSON.parse(localStorage.getItem("folio_documents") || "[]")).length;
    };
    window.__probe.pages = function () {
      return JSON.parse(localStorage.getItem("folio_documents") || "[]");
    };
    /*
     * Through the store, NOT straight out of localStorage. Page content is
     * lz-compressed behind an "LZ:" prefix (js/store.js), so reading the key
     * directly gets compressed text and JSON.parse dies on it — which is
     * exactly how the first run of this probe "failed".
     */
    window.__probe.blocksOf = function (id) {
      const doc = FolioStore.getDocument(id);
      return doc ? doc.content : null;
    };
  `);

  const bigBytes = await w.eval("window.__probe.build(" +
    JSON.stringify(TINY_PNG) + "," + JSON.stringify(MD) + ")");
  ok("the big picture really is over the 500KB compression threshold",
     bigBytes > 500 * 1024, bigBytes + " bytes");

  // ── THE DROP ───────────────────────────────────────────────────────────────
  w.eval("window.__probe.drop()");
  await wait(6000);

  const pages = w.eval("window.__probe.pages()");
  ok("exactly one page was created", pages.length === 1,
     pages.length + ": " + JSON.stringify(pages.map((p) => p.title)));
  if (!pages.length) return say("DONE");

  ok("it is titled from the document's own heading, not the Notion filename",
     pages[0].title === "Reading the Market", pages[0].title);

  // ── WHAT WAS STORED ────────────────────────────────────────────────────────
  const stored = w.eval("window.__probe.blocksOf(" + JSON.stringify(pages[0].id) + ")");
  const imageBlocks = (stored && stored.blocks || []).filter((b) => b.type === "image");
  ok("two pictures were stored — the two that were in the folder",
     imageBlocks.length === 2, String(imageBlocks.length));
  ok("the one that was missing from the folder is simply absent, not empty",
     !(stored.blocks || []).some((b) => b.type === "image" && !b.data.url));
  ok("the prose around them survived",
     (stored.blocks || []).some((b) => b.type === "paragraph" && /Closing/.test(b.data.text)));
  ok("and its formatting did",
     (stored.blocks || []).some((b) => b.type === "paragraph" && /<b>prose<\/b>/.test(b.data.text)));

  const urls = imageBlocks.map((b) => String(b.data.url || ""));
  ok("both are stored as data URLs", urls.every((u) => /^data:image\//.test(u)),
     urls.map((u) => u.slice(0, 24)).join(" | "));
  ok("the small PNG was left as a PNG",
     urls.some((u) => /^data:image\/png/.test(u)),
     urls.map((u) => u.slice(0, 20)).join(" | "));
  /*
   * THE COMPRESSION ASSERTION. A 3MB screenshot stored untouched is how the
   * first import fills the storage ceiling, so the re-encode is not a nicety.
   */
  ok("the big PNG was re-encoded as JPEG on the way in",
     urls.some((u) => /^data:image\/jpeg/.test(u)),
     urls.map((u) => u.slice(0, 20)).join(" | "));
  const biggest = Math.max(...urls.map((u) => u.length));
  ok("and it got smaller than the file it came from",
     biggest < bigBytes, biggest + " vs " + bigBytes);

  ok("the captions came from the alt text",
     imageBlocks.some((b) => b.data.caption === "a small diagram") &&
     imageBlocks.some((b) => b.data.caption === "a big screenshot"),
     JSON.stringify(imageBlocks.map((b) => b.data.caption)));

  // ── ON SCREEN, IN THE EDITOR ───────────────────────────────────────────────
  /* The import routes to the editor, which is where it should be visible. */
  ok("it opened the new page in the editor", /\/edit$/.test(w.location.hash),
     w.location.hash);

  const edImgs = Array.from(d.querySelectorAll("#editorjs img"));
  ok("both pictures are in the editor DOM", edImgs.length === 2, String(edImgs.length));
  /*
   * decode() rather than naturalWidth alone: a freshly inserted <img> can
   * still be decoding when this runs, and a flaky test is worse than no test.
   */
  await Promise.all(edImgs.map((i) => (i.decode ? i.decode().catch(() => {}) : null)));
  ok("and the browser actually decoded them — this is the whole feature",
     edImgs.length === 2 && edImgs.every((i) => i.naturalWidth > 0),
     edImgs.map((i) => i.naturalWidth + "x" + i.naturalHeight).join(" | "));

  // ── ON SCREEN, IN READ MODE ────────────────────────────────────────────────
  /* Read mode is where the pictures are looked at while commenting, which is
   * what was actually asked for, and it is a SEPARATE renderer (js/reader.js). */
  w.location.hash = "#/doc/" + pages[0].id;
  await wait(2500);

  const rdFigs = Array.from(d.querySelectorAll("#article figure.folio-image"));
  ok("read mode draws both as figures", rdFigs.length === 2, String(rdFigs.length));
  const rdImgs = Array.from(d.querySelectorAll("#article figure.folio-image img"));
  await Promise.all(rdImgs.map((i) => (i.decode ? i.decode().catch(() => {}) : null)));
  ok("and they decode there too",
     rdImgs.length === 2 && rdImgs.every((i) => i.naturalWidth > 0),
     rdImgs.map((i) => i.naturalWidth + "x" + i.naturalHeight).join(" | "));
  ok("the captions are shown under them",
     /a small diagram/.test(d.getElementById("article").textContent),
     "no caption text");

  // ── THE OLD WAY IN STILL WORKS ─────────────────────────────────────────────
  /*
   * Dragging a single .md file is the oldest way into Folio. Teaching the drop
   * handler about folders must not have cost it, and "the folder case works"
   * is not evidence either way.
   */
  w.location.hash = "#/";
  await wait(800);
  w.eval("window.__probe.dropLoneFile()");
  await wait(1500);
  const after = w.eval("window.__probe.pageCount()");
  ok("a single dropped .md file still makes exactly one more page", after === 2,
     String(after));

  // ── AND THE WELCOME DROPZONE DOES NOT DOUBLE UP ────────────────────────────
  /*
   * The dropzone and the document both listen for a drop, so before the
   * stopPropagation in js/app.js a file dropped on the welcome screen was
   * imported twice and made two pages. Fired on the dropzone itself, the
   * document-level listener must not also run.
   */
  const before = after;
  const fired = w.eval(`(function () {
    const zone = document.getElementById("dropzone");
    if (!zone) return "no-dropzone";
    const ev = new Event("drop", { bubbles: true, cancelable: true });
    ev.dataTransfer = { items: [], files: [window.__probe.lone] };
    zone.dispatchEvent(ev);
    return "fired";
  })()`);
  ok("the welcome dropzone is there to test", fired === "fired", String(fired));
  await wait(1500);
  const afterZone = w.eval("window.__probe.pageCount()");
  ok("dropping on the welcome screen imports once, not twice",
     afterZone === before + 1, before + " -> " + afterZone);

  // ── AND WHEN IT DOES NOT FIT ───────────────────────────────────────────────
  /*
   * THE CASE THIS FEATURE WILL ACTUALLY MEET.
   *
   * Measured on a real Notion export on this machine: 118 screenshots, median
   * 98KB, none of them over the 500KB mark where the compressor engages,
   * 12.71MB on disk — about 17.4MB once base64 has added its third. The
   * ceiling is 10.00MB for the whole origin. So the biggest real export cannot
   * fit in a page, and the question is not whether it fails but how.
   *
   * It has to fail CLEANLY: no half-written page in the sidebar, nothing
   * already saved damaged, and a message that says what happened. The
   * alternative is the 17 October failure — storage full, writes refused
   * everywhere, and the only clue twelve grey pixels in a corner.
   */
  w.location.hash = "#/";
  await wait(600);
  const pagesBefore = w.eval("window.__probe.pages()").map((p) => p.id);

  const filled = w.eval(`(function () {
    /*
     * Real ballast, not a stubbed setItem: a stub proves the handler, not the
     * condition, and the condition is the interesting part. Chunk sizes step
     * down so the last few bytes are exhausted too — stopping at the first
     * refusal of a big chunk leaves room the import would then fit into, and
     * the probe would be testing a disk that was not full.
     */
    var n = 0;
    var sizes = [512 * 1024, 64 * 1024, 8 * 1024, 1024, 128, 16, 1];
    for (var s = 0; s < sizes.length; s++) {
      var chunk = "x".repeat(sizes[s]);
      for (var guard = 0; guard < 20000; guard++) {
        try { localStorage.setItem("__ballast_" + (n++), chunk); }
        catch (e) { n--; break; }
      }
    }
    var headroom = "none";
    try {
      localStorage.setItem("__probe_headroom", "y");
      localStorage.removeItem("__probe_headroom");
      headroom = "STILL HAS ROOM";
    } catch (e) { headroom = "none"; }
    return headroom;
  })()`);
  ok("the disk really is full before the import is attempted", filled === "none", filled);

  w.eval("window.__probe.drop()");
  await wait(6000);

  const pagesAfter = w.eval("window.__probe.pages()").map((p) => p.id);
  ok("an import that cannot fit leaves NO half-made page behind",
     pagesAfter.length === pagesBefore.length,
     pagesBefore.length + " -> " + pagesAfter.length);

  /* Clear the ballast before checking the old pages, so the check itself can read. */
  w.eval(`(function () {
    var kill = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("__ballast_") === 0) kill.push(k);
    }
    kill.forEach(function (k) { localStorage.removeItem(k); });
    return kill.length;
  })()`);

  ok("and every page that was already saved is still readable",
     w.eval(`(function () {
       return JSON.parse(localStorage.getItem("folio_documents") || "[]").every(function (p) {
         var d = FolioStore.getDocument(p.id);
         return d && d.content && d.content.blocks && d.content.blocks.length > 0;
       });
     })()`),
     "a previously saved page became unreadable");

  say("DONE");
}

main().catch((e) => { say("FAIL probe threw  -> " + (e && e.message)); say("DONE"); });
</script>
