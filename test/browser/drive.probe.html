<!doctype html>
<meta charset="utf-8">
<title>Drive: one joined file, lock-screen controls, and a note that lands on the right paragraph</title>
<!--
  Drives the real drive.html in a real browser.

  The jsdom suite (test/chunker-parity.selftest.js) proves the drive player
  cuts a document in the same places the reader does, which is what keeps
  already-paid-for audio free. It cannot prove any of the things below, because
  they are all about a real audio element:

  1. CACHE PARITY, END TO END. The chunks drive.html actually ASKS for are
     compared against what the reader's own js/tts.js computes for the same
     document, in the same browser — not against a second copy of the rule.

  2. THE JOINED FILE. Every chunk's MP3 is concatenated into one source. If
     that did not produce one continuous playable file the whole design would
     be wrong, and on a locked iPhone it would be wrong silently. Here the
     duration of the joined file is checked against the sum of its parts.

  3. THE LOCK SCREEN. play, pause and the two fifteen-second skips must be
     registered, and previoustrack/nexttrack must NOT be — iOS shows track
     buttons INSTEAD of skip buttons when both exist, and track buttons are
     the wrong gesture for a document.

  4. A NOTE LANDS ON THE RIGHT PARAGRAPH. Seek to a known second, dictate, and
     check the comment is attached to a highlight quoting the paragraph that
     was actually being read at that second.

  5. NOTHING SPOKEN IS EVER LOST. A failed transcription must leave the audio
     in IndexedDB and say so; a later success must turn it into a note and
     empty the outbox.

  Audio is faked with hand-built silent MP3 frames rather than bought from
  Speechify: the test must not cost money, must not need a key, and must be
  able to run on a train.
-->
<div id="host"></div>
<script>
function say(m) { new Image().src = "/r?" + encodeURIComponent(String(m)) + "&_=" + Math.random(); }

/* Does this sentence range have any visible text? Blank ones get no line. */
function plainText(w, sen) {
  const p = w.__planCache || (w.__planCache =
    w.__Chunker.plan(w.document.getElementById("drive-article")));
  return p.docText.slice(sen.ds, sen.de).trim();
}
/* Which chunk the clock is inside, by the same measured durations drive.js uses. */
function chunkOf(w, d, t) {
  const st = w.__Drive._state();
  const p = w.__Chunker.plan(d.getElementById("drive-article"));
  const per = st.totalSeconds / p.chunks.length;   // the fakes are all equal length
  const i = Math.min(p.chunks.length - 1, Math.max(0, Math.floor(t / per)));
  return p.chunks[i];
}
/* Roughly which character the clock is at, for the tap-to-seek check. */
function charOf(w, d, t) {
  const c = chunkOf(w, d, t);
  return c ? c.ds : 0;
}
function ok(name, cond, extra) { say((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  -> " + extra)); }
/*
 * Wait until a scrolling box stops moving.
 *
 * Smooth scrolling is an animation, so reading scrollTop a fixed number of
 * milliseconds after asking for it measures the animation, not the app. Two
 * assertions failed that way and both were the test's fault.
 */
async function settled(box, ms) {
  let last = NaN, still = 0;
  for (let i = 0; i < 120; i++) {
    await new Promise((r) => setTimeout(r, 50));
    if (box.scrollTop === last) { still += 50; if (still >= (ms || 250)) return box.scrollTop; }
    else { still = 0; last = box.scrollTop; }
  }
  return box.scrollTop;
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const DOC = "doc_drive_probe";

/*
 * MPEG-1 Layer III, 128 kbit/s, 44.1 kHz. A 417-byte frame carries 1152
 * samples, so 38.28 frames is a second. The payload is zeroes, which every
 * decoder renders as silence — all this test needs is real, decodable,
 * measurable duration.
 */
const FRAME = 417;
const FRAMES_PER_SEC = 44100 / 1152;
function silentMp3(seconds) {
  const n = Math.round(seconds * FRAMES_PER_SEC);
  const b = new Uint8Array(FRAME * n);
  for (let i = 0; i < n; i++) {
    const o = i * FRAME;
    b[o] = 0xFF; b[o + 1] = 0xFB; b[o + 2] = 0x90; b[o + 3] = 0x00;
  }
  return new Blob([b], { type: "audio/mpeg" });
}
const FAKE_CHUNK_SECONDS = 12;

/*
 * A document long enough to be cut into many chunks, with paragraphs that are
 * individually identifiable — the note-anchoring assertion has to be able to
 * say WHICH paragraph it landed on, so each one is numbered.
 */
function buildBlocks() {
  const blocks = [{ type: "header", data: { level: 1, text: "Drive Probe Document" } }];
  for (let i = 0; i < 46; i++) {
    blocks.push({ type: "paragraph", data: { text:
      "Paragraph " + i + " begins here and is deliberately given several sentences so " +
      "the sentence segmenter has real work to do. It carries a marker, PARA" + i + "END, " +
      "which lets a test say exactly which paragraph a dictated note was filed " +
      "against. It then runs on a little further so that the chunk boundaries fall " +
      "in varied places rather than at every paragraph." } });
  }
  return blocks;
}

async function main() {
  const now = new Date().toISOString();
  localStorage.setItem("folio_documents", JSON.stringify([
    { id: DOC, title: "Drive Probe Document", icon: "", parentId: null, order: 0,
      createdAt: now, updatedAt: now }]));
  localStorage.setItem("folio_doc_" + DOC,
    JSON.stringify({ time: Date.now(), blocks: buildBlocks() }));
  localStorage.setItem("folio_comments_" + DOC, "[]");
  localStorage.setItem("folio_highlights_" + DOC, "[]");
  localStorage.setItem("folio_reads_" + DOC, "[]");
  localStorage.removeItem("folio_drive_position");

  // ------------------------------------------------------------------------
  // What the READER would ask for, from the reader's own code.
  // ------------------------------------------------------------------------
  const rf = document.createElement("iframe");
  rf.style.cssText = "width:1200px;height:800px;border:0";
  const rLoaded = new Promise((res) => { rf.onload = res; });
  rf.src = "/index.html#/doc/" + DOC;
  document.getElementById("host").appendChild(rf);
  await rLoaded;
  await wait(3000);
  let readerChunks = [];
  try {
    rf.contentWindow.eval("window.__tts = TTS;");
    readerChunks = rf.contentWindow.__tts.debugChunks()
      .map((c) => ({ ds: c.ds, de: c.de }));
  } catch (e) { say("FAIL could not read the reader's chunks  -> " + e.message); }
  ok("the reader produced chunks to compare against", readerChunks.length > 3,
     "n=" + readerChunks.length);
  rf.remove();

  // ------------------------------------------------------------------------
  // The drive page.
  // ------------------------------------------------------------------------
  const f = document.createElement("iframe");
  f.style.cssText = "width:430px;height:900px;border:0";
  const loaded = new Promise((res) => { f.onload = res; });
  f.src = "/drive.html";
  document.getElementById("host").appendChild(f);
  await loaded;
  await wait(600);

  const w = f.contentWindow, d = f.contentDocument;
  // The modules are declared with `const`, which does not put them on window,
  // so they are lifted across deliberately.
  w.__problems = [];
  w.addEventListener("error", (e) => w.__problems.push(String(e.message)));
  w.addEventListener("unhandledrejection", (e) => w.__problems.push("rejected: " + String(e.reason && e.reason.message || e.reason)));
  w.eval("window.__Drive = Drive; window.__Chunker = Chunker; " +
         "window.__Speechify = SpeechifyProvider; window.__Voice = Voice; window.__Store = FolioStore;");
  const Drive = w.__Drive, Store = w.__Store;

  // ---- the picker -------------------------------------------------------
  const rows = d.querySelectorAll(".drive-doc");
  ok("the picker lists the document", rows.length === 1, "rows=" + rows.length);
  ok("the row names the document",
     rows[0] && /Drive Probe Document/.test(rows[0].textContent),
     rows[0] ? rows[0].textContent.slice(0, 60) : "no row");
  ok("the row says how long it is",
     rows[0] && /\d+ words · about \d+ min/.test(rows[0].textContent),
     rows[0] ? rows[0].textContent : "");

  // ---- stub the paid and permissioned bits ------------------------------
  const requested = [];
  w.__Speechify.hasKey = () => true;
  w.__Speechify.keyWasRejected = () => false;
  w.__Speechify.currentVoiceId = () => "probe-voice";
  w.__Speechify.fetchChunk = function (text) {
    requested.push(text);
    return Promise.resolve({ blob: silentMp3(FAKE_CHUNK_SECONDS), marks: [], url: null });
  };

  let transcript = "This bit about incentives is the part I want to come back to.";
  let failNext = 0;
  const recorded = [];
  w.__Voice.hasKey = () => true;
  w.__Voice.startRecording = () => Promise.resolve({ probe: true });
  w.__Voice.stopRecordingRaw = () => Promise.resolve(
    new Blob([new Uint8Array(4096)], { type: "audio/mp4" }));
  w.__Voice.isRetryable = (e) => /network/i.test(e && e.message ? e.message : "");
  w.__Voice.transcribe = function (blob) {
    recorded.push(blob);
    if (failNext > 0) { failNext--; return Promise.reject(new Error("Network error contacting Groq")); }
    return Promise.resolve(transcript);
  };

  // Watch what gets put on the lock screen.
  const handlers = {};
  if (w.navigator.mediaSession) {
    const real = w.navigator.mediaSession.setActionHandler.bind(w.navigator.mediaSession);
    w.navigator.mediaSession.setActionHandler = function (name, fn) {
      handlers[name] = fn;
      try { real(name, fn); } catch (e) { /* unsupported action */ }
    };
  }

  // ---- open it ----------------------------------------------------------
  rows[0].click();
  await wait(400);

  ok("the player replaced the picker",
     d.getElementById("drive-player").classList.contains("active") &&
     !d.getElementById("drive-picker").classList.contains("active"),
     "player/picker classes wrong");
  ok("the title is shown",
     /Drive Probe Document/.test(d.getElementById("drive-title").textContent),
     d.getElementById("drive-title").textContent);

  const st0 = Drive._state();
  ok("the document was cut into several chunks", st0.chunks > 3, "chunks=" + st0.chunks);

  // ---- 1. CACHE PARITY, against the reader's own numbers ----------------
  const driveChunks = w.__Chunker
    .plan(d.getElementById("drive-article")).chunks.map((c) => ({ ds: c.ds, de: c.de }));
  ok("the drive cuts the document into the same NUMBER of chunks as the reader",
     driveChunks.length === readerChunks.length,
     "drive=" + driveChunks.length + " reader=" + readerChunks.length);
  let offsetsMatch = driveChunks.length === readerChunks.length;
  let firstBad = "";
  for (let i = 0; i < Math.min(driveChunks.length, readerChunks.length); i++) {
    if (driveChunks[i].ds !== readerChunks[i].ds || driveChunks[i].de !== readerChunks[i].de) {
      offsetsMatch = false;
      firstBad = "chunk " + i + ": drive [" + driveChunks[i].ds + "," + driveChunks[i].de +
                 ") reader [" + readerChunks[i].ds + "," + readerChunks[i].de + ")";
      break;
    }
  }
  ok("every chunk begins and ends exactly where the reader's does — so cached audio is reused",
     offsetsMatch, firstBad);

  // Wait for every chunk to be fetched and joined.
  for (let i = 0; i < 80; i++) {
    const s = Drive._state();
    if (s.ready === s.chunks && s.stitched === s.chunks) break;
    await wait(250);
  }
  const st1 = Drive._state();
  ok("every chunk was fetched", st1.ready === st1.chunks, st1.ready + "/" + st1.chunks);
  ok("every fetched chunk is in the file being played",
     st1.stitched === st1.chunks, st1.stitched + "/" + st1.chunks);
  ok("it asked for exactly one piece of audio per chunk",
     requested.length === st1.chunks, "requests=" + requested.length + " chunks=" + st1.chunks);
  ok("it says it is safe to lock the screen",
     /safe to lock/i.test(d.getElementById("drive-status").textContent),
     d.getElementById("drive-status").textContent);

  // ---- 2. THE JOINED FILE ----------------------------------------------
  const audio = d.getElementById("drive-audio");
  ok("there is exactly one audio element", d.querySelectorAll("audio").length === 1,
     "n=" + d.querySelectorAll("audio").length);
  ok("its source is a single joined blob",
     audio && /^blob:/.test(audio.src), audio ? audio.src.slice(0, 40) : "no element");

  const expected = st1.chunks * FAKE_CHUNK_SECONDS;
  ok("the joined file is as long as all its parts added together — the parts really did join",
     audio && Math.abs(audio.duration - expected) < 1.5,
     "duration=" + (audio ? audio.duration.toFixed(2) : "?") + " expected≈" + expected);

  // ---- 3. PLAYBACK AND THE LOCK SCREEN ---------------------------------
  d.getElementById("drive-play").click();
  await wait(900);
  ok("pressing play starts it", audio && !audio.paused, "paused=" + (audio && audio.paused));
  /*
   * WAIT FOR THE EVENT, do not sample once. The button's class, the lock-screen
   * handlers and the Now Playing state are all written by the `playing` event,
   * which fires some time after play() resolves. Checking 900ms after the click
   * passed for months and then failed the day an unrelated change added a few
   * milliseconds of work to opening a document — a flaky assertion that had
   * been reporting on the clock, not on the app.
   */
  for (let i = 0; i < 60; i++) {
    if (d.getElementById("drive-play").classList.contains("playing")) break;
    await wait(100);
  }
  ok("the play button shows that it is playing",
     d.getElementById("drive-play").classList.contains("playing"),
     "class missing; page errors: " + JSON.stringify(w.__problems || []));

  ok("the lock screen gets play", typeof handlers.play === "function");
  ok("the lock screen gets pause", typeof handlers.pause === "function");
  ok("the lock screen gets back fifteen seconds", typeof handlers.seekbackward === "function");
  ok("the lock screen gets forward fifteen seconds", typeof handlers.seekforward === "function");
  /*
   * iOS shows EITHER track buttons or the skip pair. Registering track handlers
   * would replace the skips with buttons that mean nothing for a document, so
   * their absence is the assertion.
   */
  ok("it does NOT ask for previous/next track, which would hide the skip buttons",
     !handlers.previoustrack && !handlers.nexttrack,
     "prev=" + !!handlers.previoustrack + " next=" + !!handlers.nexttrack);
  ok("the lock screen is told it is playing",
     !w.navigator.mediaSession || w.navigator.mediaSession.playbackState === "playing",
     w.navigator.mediaSession ? w.navigator.mediaSession.playbackState : "n/a");
  ok("the lock screen knows the document's title",
     !w.navigator.mediaSession || !w.navigator.mediaSession.metadata ||
     /Drive Probe Document/.test(w.navigator.mediaSession.metadata.title),
     w.navigator.mediaSession && w.navigator.mediaSession.metadata
       ? w.navigator.mediaSession.metadata.title : "n/a");

  // ---- skip and speed ---------------------------------------------------
  audio.currentTime = 60;
  await wait(150);
  d.getElementById("drive-fwd").click();
  await wait(250);
  ok("forward fifteen seconds moves forward about fifteen seconds",
     audio.currentTime > 72 && audio.currentTime < 78, "t=" + audio.currentTime.toFixed(2));
  d.getElementById("drive-back").click();
  await wait(250);
  ok("back fifteen seconds comes back", audio.currentTime > 57 && audio.currentTime < 63,
     "t=" + audio.currentTime.toFixed(2));

  // The same handler the lock screen would call.
  if (handlers.seekforward) {
    const before = audio.currentTime;
    handlers.seekforward({ seekOffset: 30 });
    await wait(250);
    ok("the lock screen's skip honours the interval iOS asks for",
       audio.currentTime > before + 25, "before=" + before.toFixed(1) + " after=" + audio.currentTime.toFixed(1));
  }

  const rateBefore = audio.playbackRate;
  d.getElementById("drive-faster").click();
  await wait(150);
  ok("faster really is faster", audio.playbackRate > rateBefore,
     rateBefore + " -> " + audio.playbackRate);
  ok("the speed is shown on screen", /×/.test(d.getElementById("drive-rate").textContent),
     d.getElementById("drive-rate").textContent);
  d.getElementById("drive-slower").click();
  await wait(150);
  ok("slower goes back", Math.abs(audio.playbackRate - rateBefore) < 0.001,
     "rate=" + audio.playbackRate);

  // ---- 3b. THE WORDS VIEW ----------------------------------------------
  /*
   * The second of the two views: the sentence being read, large, with the ones
   * around it dimmed. Three things have to hold — it follows the audio, it can
   * be tapped to jump, and it does not shove the controls off the screen,
   * which is exactly what it did the first time.
   */
  const viewBtn = d.getElementById("drive-view");
  ok("there is a view toggle", !!viewBtn);
  viewBtn.click();
  await wait(700);
  ok("the toggle switches to the words view",
     d.getElementById("drive-player").classList.contains("mode-words"),
     d.getElementById("drive-player").className);

  const lines = d.querySelectorAll(".lyric");
  ok("there is a line for every sentence in the document",
     lines.length === w.__Chunker.plan(d.getElementById("drive-article")).sentences
       .filter((x) => plainText(w, x)).length,
     "lines=" + lines.length);
  ok("the first line is the document's heading, so headings are lines too",
     lines.length && /Drive Probe Document/.test(lines[0].textContent),
     lines.length ? lines[0].textContent.slice(0, 50) : "no lines");
  ok("the lines carry the document's words",
     Array.prototype.some.call(lines, (l) => /Paragraph \d+ begins here/.test(l.textContent)),
     lines.length ? lines[1].textContent.slice(0, 50) : "no lines");

  const lit = d.querySelectorAll(".lyric.is-now");
  ok("exactly one line is lit", lit.length === 1, "n=" + lit.length);
  /*
   * The lit line must be the one actually being spoken. With no word marks in
   * this test the position is interpolated across the chunk, so the check is
   * that the lit line falls inside the chunk the clock is in — a wrong line
   * would be in a different chunk entirely.
   */
  if (lit.length === 1) {
    const litDs = Number(lit[0].dataset.ds);
    const here = w.__Drive._state();
    const at = chunkOf(w, d, audio.currentTime);
    ok("the lit line is inside the chunk being played",
       at && litDs >= at.ds && litDs < at.de,
       "line at " + litDs + ", chunk [" + (at && at.ds) + "," + (at && at.de) + ")");
    void here;
  }

  /*
   * NOTHING MAY OVERLAP ANYTHING. The first version of this view used 80vh of
   * padding, which a flex item cannot shrink below, so the list was 682px tall
   * inside a 529px box: the words lay across the transport and the record bar
   * fell off the bottom of the screen. Every control was unreachable and every
   * functional assertion still passed.
   */
  const order = [".drive-topbar", ".drive-progress", "#drive-lyrics",
                 ".drive-record-wrap", ".drive-transport", ".drive-speed", ".drive-foot"];
  let overlap = "";
  let prevBottom = -1, prevName = "the top of the screen";
  order.forEach(function (sel) {
    const node = d.querySelector(sel);
    if (!node) { overlap = overlap || (sel + " is missing"); return; }
    const r = node.getBoundingClientRect();
    if (r.top < prevBottom - 1) {
      overlap = overlap || (sel + " (top " + Math.round(r.top) + ") runs into " +
                            prevName + " (bottom " + Math.round(prevBottom) + ")");
    }
    prevBottom = r.bottom; prevName = sel;
  });
  ok("in the words view nothing overlaps anything else", overlap === "", overlap);

  /*
   * IT MUST ACTUALLY SCROLL, AND KEEP THE LIT LINE IN THE MIDDLE.
   *
   * There was no assertion for this at all. The view was checked for lighting
   * the right line and for tapping to seek; nothing ever measured whether the
   * box moved, so "it just doesn't auto scroll" (28 October 2026) went to the
   * road unnoticed. A missing check, not a failing one.
   */
  {
    const box = d.getElementById("drive-lyrics");
    const centreError = function () {
      const now = d.querySelector(".lyric.is-now");
      if (!now) return null;
      const r = now.getBoundingClientRect(), b = box.getBoundingClientRect();
      return Math.abs((r.top + r.height / 2) - (b.top + b.height / 2));
    };
    // Far enough along that the line it lands on is well past the first screenful.
    audio.currentTime = (audio.duration || 0) * 0.6;
    for (let i = 0; i < 40; i++) { await wait(100); if (box.scrollTop > 0) break; }
    await settled(box);
    ok("the list scrolled rather than staying at the top", box.scrollTop > 0,
       "scrollTop=" + Math.round(box.scrollTop));
    const err1 = centreError();
    ok("the lit line is near the middle of the list",
       err1 !== null && err1 < box.clientHeight * 0.25,
       "off centre by " + Math.round(err1 || -1) + "px of " + box.clientHeight);

    /*
     * A STATIONARY TAP MUST NOT FREEZE IT. The hold used to arm on pointerdown,
     * so a tap that landed between two lines stopped the view following for six
     * seconds with nothing on screen to say so — his "it doesn't auto scroll
     * sometimes when I have messed with it".
     */
    const before = box.scrollTop;
    /*
     * WITH THE JITTER A REAL THUMB HAS. The first version of this sent
     * pointerdown and pointerup at identical coordinates and no pointermove at
     * all — so breaking the movement threshold on purpose changed nothing and
     * the mutation passed. No finger is that still; two pixels is a tap.
     */
    box.dispatchEvent(new w.PointerEvent("pointerdown", { clientX: 10, clientY: 300, bubbles: true }));
    box.dispatchEvent(new w.PointerEvent("pointermove", { clientX: 11, clientY: 302, bubbles: true }));
    box.dispatchEvent(new w.PointerEvent("pointerup", { clientX: 11, clientY: 302, bubbles: true }));
    audio.currentTime = (audio.duration || 0) * 0.8;
    for (let i = 0; i < 40; i++) { await wait(100); if (box.scrollTop !== before) break; }
    await settled(box);
    ok("a tap that moves nothing does not stop it following",
       box.scrollTop !== before, "still at " + Math.round(box.scrollTop));

    /* A DRAG MUST freeze it — that part was right and must stay right. */
    const held = await settled(box);
    box.dispatchEvent(new w.PointerEvent("pointerdown", { clientX: 10, clientY: 300, bubbles: true }));
    box.dispatchEvent(new w.PointerEvent("pointermove", { clientX: 10, clientY: 240, bubbles: true }));
    audio.currentTime = (audio.duration || 0) * 0.35;
    await wait(900);
    ok("but a drag does stop it, so looking ahead is not snatched back",
       Math.abs(box.scrollTop - held) < 2,
       "moved to " + Math.round(box.scrollTop) + " from " + Math.round(held));
    box.dispatchEvent(new w.PointerEvent("pointerup", { clientX: 10, clientY: 240, bubbles: true }));
  }

  const foot = d.querySelector(".drive-foot").getBoundingClientRect();
  ok("the last row is still on the screen",
     foot.bottom <= w.innerHeight + 1,
     "foot bottom=" + Math.round(foot.bottom) + " viewport=" + w.innerHeight);

  // Tap a line to go there.
  const target = lines[Math.min(lines.length - 1, 40)];
  const wantChar = Number(target.dataset.ds);
  target.click();
  await wait(500);
  const landedChar = charOf(w, d, audio.currentTime);
  ok("tapping a line jumps to roughly where that line is spoken",
     Math.abs(landedChar - wantChar) < 900,
     "wanted char " + wantChar + ", landed near " + landedChar);

  // Back to the big button, and the choice is remembered.
  viewBtn.click();
  await wait(300);
  ok("the toggle switches back", !d.getElementById("drive-player").classList.contains("mode-words"));
  ok("which view you chose is remembered",
     w.localStorage.getItem("folio_drive_view") === "focus",
     String(w.localStorage.getItem("folio_drive_view")));

  // ---- 4. A NOTE LANDS ON THE RIGHT PARAGRAPH --------------------------
  /*
   * Park the clock at a known second, so which paragraph "is being read" is a
   * fact and not a guess. The chunk it falls in is known from the fake
   * durations, and the paragraph from the chunk's character range.
   */
  const targetChunk = 3;
  audio.currentTime = targetChunk * FAKE_CHUNK_SECONDS + FAKE_CHUNK_SECONDS / 2;
  await wait(300);

  const anchor = Drive._anchorHere();
  ok("the anchor quotes a real paragraph of the document",
     /PARA\d+END/.test(anchor.text), (anchor.text || "").slice(0, 70));
  const expectedPara = w.__Chunker
    .plan(d.getElementById("drive-article"));
  const midChunk = expectedPara.chunks[targetChunk];
  const midPos = Math.round(midChunk.ds + 0.5 * (midChunk.de - midChunk.ds));
  const expectedBlock = w.__Chunker.blockAt(expectedPara.blocks, midPos);
  ok("the anchor is the paragraph that was being read at that second",
     expectedBlock && anchor.text === expectedBlock.el.textContent,
     "anchor=" + (anchor.text || "").slice(0, 40) +
     " expected=" + (expectedBlock ? expectedBlock.el.textContent.slice(0, 40) : "none"));

  const rec = d.getElementById("drive-record");
  /*
   * THE PRESS MUST CHANGE THE BUTTON BEFORE THE MICROPHONE ARRIVES.
   *
   * On iOS, granting a microphone while audio is playing costs about two
   * seconds — the phone has to reconfigure its audio session. The old code
   * wrote the button only after that resolved, so pressing the biggest control
   * on the screen did nothing visible for two seconds and the only way to find
   * out whether it had heard you was to watch it. From the road, 28 October
   * 2026: "I have to wait 2 seconds till it starts recording. That is the
   * problem."
   *
   * Simulated here by making the grant slow on purpose, and read DURING it.
   */
  const realStart = w.__Voice.startRecording;
  w.__Voice.startRecording = () => new Promise((r) => setTimeout(() => r({ probe: true }), 900));
  rec.click();
  await wait(200);                               // mid-grant: the mic is not live yet
  ok("the button changes on the press, not when the microphone arrives",
     /mic/i.test(d.getElementById("drive-record-label").textContent),
     JSON.stringify(d.getElementById("drive-record-label").textContent));
  ok("and it is visibly not idle while that is happening",
     rec.classList.contains("working") && !rec.classList.contains("recording"),
     rec.className);
  ok("pressing again mid-grant does not count as stopping",
     (function () { rec.click(); return !rec.classList.contains("recording"); })(),
     rec.className);
  await wait(1000);                              // the grant lands
  ok("and it says, differently, when the microphone is actually live",
     /Recording/.test(d.getElementById("drive-record-label").textContent) &&
     rec.classList.contains("recording") && !rec.classList.contains("working"),
     JSON.stringify(d.getElementById("drive-record-label").textContent) + " " + rec.className);
  rec.click();                                   // discard that one
  await wait(1200);
  Store.saveComments(DOC, []);
  Store.saveHighlights(DOC, []);
  // ...and the line it drew in the words view, which clearing the store does
  // not touch. Without this the next assertion counts two notes and blames the
  // app for the test's leftovers.
  Array.prototype.forEach.call(d.querySelectorAll(".lyric-note"), (n) => n.remove());
  w.__Voice.startRecording = realStart;

  rec.click();                                   // start recording
  await wait(350);
  ok("recording shows on the button", rec.classList.contains("recording"), rec.className);
  ok("recording pauses the reading", audio.paused, "still playing");
  ok("the label counts the recording up",
     /Recording/.test(d.getElementById("drive-record-label").textContent),
     d.getElementById("drive-record-label").textContent);

  rec.click();                                   // stop, save, transcribe
  await wait(1500);
  ok("the reading starts again by itself", !audio.paused, "still paused");
  ok("the button went back to normal", !rec.classList.contains("recording"), rec.className);

  const comments = Store.getComments(DOC);
  ok("the note was written as a comment", comments.length === 1, "n=" + comments.length);
  ok("the comment holds what was said",
     comments[0] && comments[0].text === transcript,
     comments[0] ? comments[0].text : "no comment");
  ok("the comment is attached to a highlight, not left floating",
     comments[0] && comments[0].highlightId && !comments[0].isGeneral,
     comments[0] ? "highlightId=" + comments[0].highlightId + " general=" + comments[0].isGeneral : "");
  ok("the comment records where in the audio it was spoken",
     comments[0] && typeof comments[0].driveAudioTime === "number" && comments[0].driveAudioTime > 1,
     comments[0] ? String(comments[0].driveAudioTime) : "");

  /*
   * AND HE MUST BE ABLE TO SEE IT. "I never see what was transcribed" — the
   * toast used to name the document and not the words, so a mis-heard note
   * looked exactly like a good one.
   */
  ok("the toast shows the words that were heard, not just that a note exists",
     d.getElementById("drive-note").textContent.indexOf(transcript) >= 0,
     JSON.stringify(d.getElementById("drive-note").textContent));
  d.getElementById("drive-view").click();        // into the words view
  await wait(400);
  {
    const live = d.querySelectorAll(".lyric-note");
    ok("the note appears in the words view the moment it is saved",
       live.length === 1, "found " + live.length);
    ok("it is under a sentence, where it was said",
       live.length === 1 && live[0].previousElementSibling &&
       live[0].previousElementSibling.classList.contains("lyric"),
       live.length ? String(live[0].previousElementSibling &&
                            live[0].previousElementSibling.className) : "none");
    ok("the counter says a note is saved, so the screen never looks empty-handed",
       /1 note saved/.test(d.getElementById("drive-outbox").textContent),
       JSON.stringify(d.getElementById("drive-outbox").textContent));
  }
  d.getElementById("drive-view").click();        // back to the big button
  await wait(300);

  const hls = Store.getHighlights(DOC);
  ok("a highlight was created for it", hls.length === 1, "n=" + hls.length);
  ok("the highlight quotes the paragraph that was being read",
     hls[0] && /PARA\d+END/.test(hls[0].text), hls[0] ? hls[0].text.slice(0, 60) : "");
  ok("the highlight is the one the comment points at",
     hls[0] && comments[0] && hls[0].id === comments[0].highlightId);
  ok("the highlight carries a read, which is what the export groups on",
     hls[0] && hls[0].readId, hls[0] ? String(hls[0].readId) : "");
  ok("the highlight stores where in the article it is, so the reader can re-find it",
     hls[0] && typeof hls[0].startNodeIndex === "number" && hls[0].endNodeIndex >= hls[0].startNodeIndex,
     hls[0] ? hls[0].startNodeIndex + ".." + hls[0].endNodeIndex : "");
  /*
   * The stored node indices must resolve in the READER's article, not just in
   * the drive page's hidden copy — that is the whole point of rendering the
   * document with the reader's own converter.
   */
  const driveNodes = w.__Chunker.textNodes(d.getElementById("drive-article"));
  ok("the quoted text is exactly what those node indices cover",
     hls[0] && driveNodes[hls[0].startNodeIndex] &&
     (driveNodes[hls[0].startNodeIndex].nodeValue || "").indexOf(hls[0].text.slice(0, 20)) === 0,
     hls[0] && driveNodes[hls[0].startNodeIndex]
       ? JSON.stringify(driveNodes[hls[0].startNodeIndex].nodeValue.slice(0, 40))
       : "index did not resolve");

  // ---- 5. NOTHING SPOKEN IS EVER LOST ----------------------------------
  failNext = 1;                       // the next upload fails, retryably
  transcript = "The second thought, saved after the connection came back.";
  rec.click(); await wait(300);
  rec.click(); await wait(1500);

  ok("a failed upload does not lose the note",
     /waiting to send/.test(d.getElementById("drive-outbox").textContent),
     d.getElementById("drive-outbox").textContent);
  ok("the outbox is visible when something is in it",
     d.getElementById("drive-outbox").classList.contains("visible"));
  const afterFail = Store.getComments(DOC);
  ok("a failed upload writes no comment yet", afterFail.length === 1, "n=" + afterFail.length);
  ok("the audio is being held, not thrown away", Drive._state().outboxCount === 1,
     "outbox=" + Drive._state().outboxCount);

  // The held audio must survive a RELOAD, which is the case memory cannot cover.
  const reloaded = new Promise((res) => { f.onload = res; });
  f.contentWindow.location.reload();
  await reloaded;
  await wait(800);
  const w2 = f.contentWindow;
  w2.eval("window.__Drive = Drive; window.__Voice = Voice; window.__Store = FolioStore;");
  ok("the held recording is still there after a reload",
     w2.__Drive._state().outboxCount === 1, "outbox=" + w2.__Drive._state().outboxCount);

  // Now let it succeed.
  w2.__Voice.hasKey = () => true;
  w2.__Voice.transcribe = () => Promise.resolve(transcript);
  w2.__Voice.isRetryable = () => true;
  await w2.__Drive._flushOutbox();
  await wait(700);

  const finalComments = w2.__Store.getComments(DOC);
  ok("once the connection is back the held note becomes a comment",
     finalComments.length === 2, "n=" + finalComments.length);
  ok("it is the right text",
     finalComments.some((c) => c.text === transcript),
     finalComments.map((c) => c.text.slice(0, 25)).join(" | "));
  ok("the outbox empties once everything is sent",
     w2.__Drive._state().outboxCount === 0, "outbox=" + w2.__Drive._state().outboxCount);
  ok("the held note kept its paragraph through the reload",
     finalComments.every((c) => c.highlightId && !c.isGeneral),
     finalComments.map((c) => String(c.highlightId)).join(" | "));

  // ---- 5b. STOPPING FOR PETROL -----------------------------------------
  /*
   * A drive gets interrupted. Coming back to the beginning of a forty minute
   * document because the tab was closed at a services would be worse than no
   * resume at all, because you would not notice until you had re-heard ten
   * minutes of it.
   */
  // The frame was reloaded by the outbox test above, so it is showing the
  // picker again. Open the document afresh — which is also what a real
  // interrupted drive does.
  const w2a = f.contentWindow, d2a = f.contentDocument;
  w2a.eval("window.__Drive = Drive; window.__Speechify = SpeechifyProvider; window.__Voice = Voice;");
  w2a.__Speechify.hasKey = () => true;
  w2a.__Speechify.keyWasRejected = () => false;
  w2a.__Speechify.currentVoiceId = () => "probe-voice";
  w2a.__Speechify.fetchChunk = () => Promise.resolve(
    { blob: silentMp3(FAKE_CHUNK_SECONDS), marks: [], url: null });
  d2a.querySelector(".drive-doc").click();
  for (let i = 0; i < 100; i++) {
    const s2 = w2a.__Drive._state();
    if (s2.chunks && s2.stitched === s2.chunks) break;
    await wait(200);
  }
  d2a.getElementById("drive-play").click();
  await wait(500);
  const audio2 = d2a.getElementById("drive-audio");
  let savedAt = 0;
  ok("the document re-opened so the resume can be tested at all", !!audio2);
  if (audio2) {
    audio2.currentTime = 95;
    savedAt = 95;
    await wait(2600);                  // the position is written at most once every 2s
  }
  const stored = JSON.parse(w2a.localStorage.getItem("folio_drive_position") || "null");
  ok("where you had got to is remembered",
     stored && stored.docId === DOC && Math.abs(stored.time - savedAt) < 4,
     JSON.stringify(stored));

  const back = new Promise((res) => { f.onload = res; });
  f.contentWindow.location.reload();
  await back;
  await wait(700);
  const w3 = f.contentWindow, d3 = f.contentDocument;
  w3.eval("window.__Drive = Drive; window.__Speechify = SpeechifyProvider; window.__Voice = Voice;");
  ok("the page you were on is offered first",
     /resumes at/.test(d3.querySelector(".drive-doc").textContent),
     d3.querySelector(".drive-doc").textContent);

  // ---- 5c. WITH NO SPEECHIFY KEY ---------------------------------------
  /*
   * The system voice cannot play with the screen locked, so a drive without
   * Speechify is not a degraded drive, it is no drive. Saying that plainly
   * beats a play button that silently does nothing.
   */
  w3.__Speechify.hasKey = () => false;
  d3.querySelector(".drive-doc").click();
  await wait(600);
  ok("with no Speechify key it says exactly what is missing and why",
     /Speechify key/.test(d3.getElementById("drive-status").textContent) &&
     /locked/.test(d3.getElementById("drive-status").textContent),
     d3.getElementById("drive-status").textContent);

  // ---- 6. A PHONE THAT HAS NEVER SEEN FOLIO ----------------------------
  /*
   * The storage is per browser, so a new phone starts with no pages AND no
   * keys. If the picker cannot take a backup, the drive screen on that phone
   * is an empty list with no way forward — so both halves are checked: that it
   * says what to do, and that doing it works.
   */
  const g = document.createElement("iframe");
  const gLoaded = new Promise((res) => { g.onload = res; });
  // A different port-less path on the same origin still shares localStorage,
  // so the store is emptied first to stage a genuinely new device.
  // The keys are the half of this that is easy to forget: a phone can have
  // every page and still be unable to say a word or save a note.
  localStorage.setItem("folio_speechify_key", "sk_probe_speechify");
  localStorage.setItem("folio_groq_key", "gsk_probe_groq");
  const backup = JSON.parse(JSON.stringify(Store.exportAll()));
  Object.keys(localStorage).filter((k) => k.indexOf("folio_") === 0)
    .forEach((k) => localStorage.removeItem(k));
  g.src = "/drive.html";
  document.getElementById("host").appendChild(g);
  await gLoaded;
  await wait(500);
  const gd = g.contentDocument, gw = g.contentWindow;

  {
    const empty = gd.getElementById("drive-doc-list").textContent;
    const routes = ["Paste a page", "Open a file", "Voice keys"];
    const missing = routes.filter((r) => !empty.includes(r));
    ok("a phone with nothing on it names every way forward rather than showing an empty screen",
       empty.length > 40 && missing.length === 0,
       missing.length ? "never mentions: " + missing.join(", ") : empty.slice(0, 60));
    /* Each named route must be a control that is actually there to tap. */
    const absent = [["Paste a page", "drive-add-btn"], ["Open a file", "drive-import"],
                    ["Voice keys", "drive-keys-btn"]]
      .filter((pair) => !gd.getElementById(pair[1]));
    ok("and every route it names is a control on the screen",
       absent.length === 0, absent.map((p) => p[0]).join(", "));
  }
  ok("the import control is on the picker", !!gd.getElementById("drive-import"));

  ok("the backup carries the voice keys, which a new phone has none of",
     backup.folio_speechify_key === "sk_probe_speechify" &&
     backup.folio_groq_key === "gsk_probe_groq",
     "speechify=" + backup.folio_speechify_key + " groq=" + backup.folio_groq_key);

  gw.eval("window.__Store = FolioStore; window.__Drive = Drive; " +
          "window.__Speechify = SpeechifyProvider;");
  /*
   * Driven through the real file input, not by calling the store.
   *
   * The first version of this called FolioStore.importAll directly and passed
   * while the actual button was still leaving the phone with no voice keys —
   * the test was exercising the library, not the feature.
   */
  const dt = new DataTransfer();
  dt.items.add(new File([JSON.stringify(backup)], "folio-backup.json",
                        { type: "application/json" }));
  const input = gd.getElementById("drive-import");
  input.files = dt.files;
  input.dispatchEvent(new gw.Event("change", { bubbles: true }));
  for (let i = 0; i < 40; i++) {
    if (gd.querySelectorAll(".drive-doc").length) break;
    await wait(150);
  }
  ok("importing a backup puts the pages back",
     gd.querySelectorAll(".drive-doc").length > 0,
     "rows=" + gd.querySelectorAll(".drive-doc").length);
  ok("the imported document is readable again",
     (gw.__Store.readPage(DOC) || {}).blocks &&
     gw.__Store.readPage(DOC).blocks.length > 10,
     "blocks=" + ((gw.__Store.readPage(DOC) || {}).blocks || []).length);
  ok("the notes made on the drive came back with it",
     gw.__Store.getComments(DOC).length === 2,
     "n=" + gw.__Store.getComments(DOC).length);
  ok("the voice keys arrived on the new phone, so it can read and can listen",
     gw.localStorage.getItem("folio_speechify_key") === "sk_probe_speechify" &&
     gw.localStorage.getItem("folio_groq_key") === "gsk_probe_groq",
     "speechify=" + gw.localStorage.getItem("folio_speechify_key") +
     " groq=" + gw.localStorage.getItem("folio_groq_key"));

  // ==========================================================================
  // GETTING A PAGE ONTO THE PHONE WITHOUT A LAPTOP
  //
  // The backup path above assumes there IS a laptop with a Folio library on
  // it, reachable, right now. On a drive there usually is not — what there is
  // is something already on the clipboard. These check the two ways in that do
  // not need the computer at all.
  // ==========================================================================
  {
    gw.localStorage.clear();
    gd.getElementById("drive-keys-btn").click();
    ok("Voice keys opens its own screen",
       gd.getElementById("drive-keys").classList.contains("active") &&
       !gd.getElementById("drive-picker").classList.contains("active"),
       "keys=" + gd.getElementById("drive-keys").className);

    /*
     * Typed, not written to localStorage by the test. A field that is not
     * actually read by the save button would pass the other way round.
     */
    gd.getElementById("drive-key-speechify").value = "sk_typed_on_the_phone";
    gd.getElementById("drive-key-groq").value = "gsk_typed_on_the_phone";
    gd.getElementById("drive-keys-save").click();
    await wait(150);
    ok("a key typed on the phone is saved where the reader looks for it",
       gw.localStorage.getItem("folio_speechify_key") === "sk_typed_on_the_phone" &&
       gw.localStorage.getItem("folio_groq_key") === "gsk_typed_on_the_phone",
       "sp=" + gw.localStorage.getItem("folio_speechify_key"));
    ok("saving the keys returns you to the list",
       gd.getElementById("drive-picker").classList.contains("active"));

    gd.getElementById("drive-keys-btn").click();
    await wait(80);
    ok("reopening the keys screen shows what is already saved",
       gd.getElementById("drive-key-speechify").value === "sk_typed_on_the_phone",
       "field=" + gd.getElementById("drive-key-speechify").value);
    gd.getElementById("drive-keys-back").click();

    /*
     * iOS Safari zooms the whole page in when you focus a field whose text is
     * under 16px, and does not zoom back out — leaving the controls off the
     * edge of a screen you are meant to be glancing at. Measured, not assumed.
     */
    const smallFields = ["drive-key-speechify", "drive-key-groq", "drive-add-title", "drive-add-text"]
      .filter((id) => parseFloat(gw.getComputedStyle(gd.getElementById(id)).fontSize) < 16);
    ok("no field is small enough to make Safari zoom in and stay there",
       smallFields.length === 0, "too small: " + smallFields.join(", "));

    // ---- pasting a page ----
    gd.getElementById("drive-add-btn").click();
    ok("Paste a page opens its own screen",
       gd.getElementById("drive-add").classList.contains("active"));

    gd.getElementById("drive-add-save").click();
    await wait(120);
    ok("saving nothing does not make an empty page",
       gw.__Store.listDocuments().length === 0 &&
       gd.getElementById("drive-add").classList.contains("active"),
       "docs=" + gw.__Store.listDocuments().length);

    const PASTED = [
      "# What I actually want from the quarter",
      "",
      "Three things, and **only** three, because a list of nine is a list of none.",
      "",
      "- Ship the thing that is nearly shipped.",
      "- Say no to the two that are not.",
      "",
      "> The rest is next quarter's problem.",
    ].join("\n");
    gw.__Speechify.hasKey = () => true;
    gw.__Speechify.keyWasRejected = () => false;
    gw.__Speechify.currentVoiceId = () => "probe-voice";
    gw.__Speechify.fetchChunk = () => Promise.resolve(
      { blob: silentMp3(FAKE_CHUNK_SECONDS), marks: [], url: null });

    gd.getElementById("drive-add-text").value = PASTED;
    gd.getElementById("drive-add-save").click();
    for (let i = 0; i < 40; i++) {
      if (gw.__Store.listDocuments().length) break;
      await wait(100);
    }
    const made = gw.__Store.listDocuments()[0];
    ok("pasted text becomes a page", !!made, "docs=" + gw.__Store.listDocuments().length);
    ok("the first heading becomes the title, so the list is readable",
       made && made.title === "What I actually want from the quarter",
       "title=" + (made && made.title));

    const blocks = ((made && gw.__Store.readPage(made.id)) || {}).blocks || [];
    const types = blocks.map((b) => b.type).join(",");
    ok("the markdown shape survives — heading, paragraph, list, quote",
       /header/.test(types) && /paragraph/.test(types) && /list/.test(types) && /quote/.test(types),
       types);
    ok("bold inside the pasted text survives in a tag the editor keeps",
       /<b>only<\/b>/.test(JSON.stringify(blocks)),
       JSON.stringify(blocks).slice(0, 160));

    /*
     * THE POINT OF THE WHOLE SCREEN: a pasted page has to be readable by the
     * same chunker the reader uses, or it will play differently from a page
     * that came over in a backup. Run the real plan over it.
     */
    ok("a pasted page goes straight into the player",
       gd.getElementById("drive-player").classList.contains("active"),
       "player=" + gd.getElementById("drive-player").className);
    for (let i = 0; i < 60; i++) {
      const st = gw.__Drive._state();
      if (st.chunks > 0) break;
      await wait(100);
    }
    ok("the chunker found something to read in it",
       gw.__Drive._state().chunks > 0, "chunks=" + gw.__Drive._state().chunks);
    ok("and the lyric view has a line per sentence of it",
       gd.querySelectorAll("#drive-lyrics .lyric").length > 3,
       "lines=" + gd.querySelectorAll("#drive-lyrics .lyric").length);

    gd.getElementById("drive-exit").click();
    await wait(200);

    // ---- opening a markdown file, which is the same path with a file on it ----
    const mdDt = new DataTransfer();
    mdDt.items.add(new File(["## A file from somewhere else\n\nWith a line in it."],
                            "thoughts-on-pricing.md", { type: "text/markdown" }));
    const inp = gd.getElementById("drive-import");
    inp.files = mdDt.files;
    inp.dispatchEvent(new gw.Event("change", { bubbles: true }));
    for (let i = 0; i < 40; i++) {
      if (gd.getElementById("drive-add").classList.contains("active")) break;
      await wait(100);
    }
    ok("a markdown file lands in the paste box rather than being refused as a backup",
       gd.getElementById("drive-add").classList.contains("active") &&
       /A file from somewhere else/.test(gd.getElementById("drive-add-text").value),
       "screen=" + gd.getElementById("drive-add").className);
    ok("and its filename is offered as the title",
       gd.getElementById("drive-add-title").value === "thoughts-on-pricing",
       "title=" + gd.getElementById("drive-add-title").value);

    /*
     * A BACKUP THAT IS NOT CALLED .json. This is the whole reason the router
     * reads the file's contents rather than its name: a backup AirDropped off a
     * Mac, or saved out of Mail, or renamed by Files, arrives called whatever
     * it arrives called. Without this assertion the router could be changed to
     * trust the extension and every other check here would still pass —
     * proven by running exactly that mutation.
     */
    gd.getElementById("drive-add-back").click();
    gw.localStorage.clear();
    gw.__Drive.init();
    await wait(200);
    const oddDt = new DataTransfer();
    oddDt.items.add(new File([JSON.stringify(backup)], "Backup Oct 28",
                             { type: "application/octet-stream" }));
    const oddInput = gd.getElementById("drive-import");
    oddInput.files = oddDt.files;
    oddInput.dispatchEvent(new gw.Event("change", { bubbles: true }));
    for (let i = 0; i < 40; i++) {
      if (gd.querySelectorAll(".drive-doc").length) break;
      await wait(150);
    }
    ok("a backup is recognised by what is in it, not by being called .json",
       gd.querySelectorAll(".drive-doc").length > 0 &&
       !gd.getElementById("drive-add").classList.contains("active"),
       "rows=" + gd.querySelectorAll(".drive-doc").length +
       " onAddScreen=" + gd.getElementById("drive-add").classList.contains("active"));
  }

  // ==========================================================================
  // THE NOTES ARE SAFE, AND HE CAN SEE THEM
  //
  // His words, mid-drive: "I have this anxiety that I will just [be] taking
  // notes and they're not getting saved." Three things have to be true for that
  // anxiety to be unfounded, and none of them were asserted before.
  // ==========================================================================
  {
    const g2 = document.createElement("iframe");
    g2.style.cssText = "width:393px;height:852px;border:0";
    const l2 = new Promise((r) => { g2.onload = r; });
    g2.src = "/drive.html";
    document.getElementById("host").appendChild(g2);
    await l2;
    await wait(400);
    const nw = g2.contentWindow, nd = g2.contentDocument;
    nw.eval("window.__Drive = Drive; window.__Store = FolioStore; " +
            "window.__Speechify = SpeechifyProvider; window.__Voice = Voice;");
    nw.__Speechify.hasKey = () => true;
    nw.__Speechify.keyWasRejected = () => false;
    nw.__Speechify.currentVoiceId = () => "probe-voice";
    nw.__Speechify.fetchChunk = () => Promise.resolve(
      { blob: silentMp3(FAKE_CHUNK_SECONDS), marks: [], url: null });

    /*
     * A note shaped exactly as the version now on his phone writes them —
     * a comment with a highlight and no docPos, because docPos did not exist
     * when it was saved. A deploy must not lose or misplace it.
     */
    const docs = nw.__Store.listDocuments();
    const target = docs[0];
    const hl = {
      id: "hl_before_deploy", color: "yellow", readId: null,
      startNodeIndex: 4, startOffset: 0, endNodeIndex: 4, endOffset: 10,
      text: "whatever paragraph it was", createdAt: "2026-10-28T19:00:00.000Z",
    };
    nw.__Store.saveHighlights(target.id, [hl]);
    nw.__Store.saveComments(target.id, [{
      id: "cm_before_deploy", highlightId: "hl_before_deploy", isGeneral: false,
      readId: null, text: "The thought I had on the motorway.",
      createdAt: "2026-10-28T19:00:01.000Z", updatedAt: "2026-10-28T19:00:01.000Z",
      driveAudioTime: 212.5,
    }]);

    nd.querySelector(".drive-doc").click();
    for (let i = 0; i < 100; i++) {
      if (nw.__Drive._state().chunks) break;
      await wait(100);
    }
    nd.getElementById("drive-view").click();
    await wait(500);

    const notes = nd.querySelectorAll(".lyric-note");
    ok("a note saved before this deploy is still there after it",
       notes.length === 1, "found " + notes.length);
    ok("and it shows the words, not just that a note exists",
       notes.length === 1 && /The thought I had on the motorway\./.test(notes[0].textContent),
       notes.length ? notes[0].textContent.slice(0, 60) : "none");
    ok("it sits under a sentence rather than piling up at the top",
       notes.length === 1 && notes[0].previousElementSibling &&
       notes[0].previousElementSibling.classList.contains("lyric"),
       notes.length ? String(notes[0].previousElementSibling &&
                             notes[0].previousElementSibling.className) : "none");
    /*
     * It must not dim with distance the way the sentences do. A note you cannot
     * read when you scroll back to it has not really been shown to you.
     */
    if (notes.length === 1) {
      const op = parseFloat(nw.getComputedStyle(notes[0]).opacity);
      ok("and it stays readable wherever the reading has got to", op > 0.9, "opacity=" + op);
    }

    /* The store it came from is the one the main app reads. Same key, same origin. */
    ok("it is an ordinary comment, so the full app on the same phone shows it too",
       (JSON.parse(nw.localStorage.getItem("folio_comments_" + target.id)) || [])
         .some((c) => c.id === "cm_before_deploy"),
       "not in folio_comments_" + target.id);

    nd.getElementById("drive-exit").click();
    await wait(200);
  }

  // ==========================================================================
  // ONE UNREADABLE PIECE MUST NOT TAKE THE WHOLE DOCUMENT DOWN
  //
  // From the road, 28 October 2026: "The phone would not start audio: The
  // operation is not supported." One chunk the browser could not decode was
  // waved through with a guessed duration, joined into the file, and made the
  // entire joined MP3 undecodable — then survived every reload, because the
  // cache is keyed on the text and kept returning the same bytes.
  // ==========================================================================
  {
    const b1 = document.createElement("iframe");
    b1.style.cssText = "width:393px;height:852px;border:0";
    const bl = new Promise((r) => { b1.onload = r; });
    b1.src = "/drive.html";
    document.getElementById("host").appendChild(b1);
    await bl;
    await wait(400);
    const bw = b1.contentWindow, bd = b1.contentDocument;
    bw.eval("window.__Drive = Drive; window.__Speechify = SpeechifyProvider; " +
            "window.__Store = FolioStore;");
    bw.__Speechify.hasKey = () => true;
    bw.__Speechify.keyWasRejected = () => false;
    bw.__Speechify.currentVoiceId = () => "probe-voice";

    /*
     * The third piece is rubbish the first time it is asked for and real the
     * second — exactly what a bad cached entry looks like once it has been
     * forgotten and fetched again.
     */
    let served = 0, forgotten = 0, badServedTwice = false;
    const rubbish = () => new Blob([new Uint8Array(4096).fill(0x42)], { type: "audio/mpeg" });
    const poisoned = {};
    bw.__Speechify.forget = function (text) { forgotten++; poisoned[text] = true; return Promise.resolve(true); };
    bw.__Speechify.fetchChunk = function (text) {
      served++;
      const isThird = /PARA6|PARA7/.test(text);
      if (isThird && !poisoned[text]) {
        return Promise.resolve({ blob: rubbish(), marks: [], url: null });
      }
      if (isThird && poisoned[text]) badServedTwice = true;   // it was re-fetched, good
      return Promise.resolve({ blob: silentMp3(FAKE_CHUNK_SECONDS), marks: [], url: null });
    };

    bd.querySelector(".drive-doc").click();
    for (let i = 0; i < 200; i++) {
      const st = bw.__Drive._state();
      if (st.chunks && st.ready === st.chunks && st.stitched === st.chunks) break;
      await wait(100);
    }
    const st = bw.__Drive._state();
    ok("an unreadable piece is thrown away and fetched again rather than joined in",
       forgotten > 0, "forget was never called");
    ok("the whole document still prepares", st.chunks > 0 && st.ready === st.chunks,
       "ready=" + st.ready + "/" + st.chunks);

    bd.getElementById("drive-play").click();
    for (let i = 0; i < 60; i++) {
      if (bd.getElementById("drive-play").classList.contains("playing")) break;
      await wait(100);
    }
    const ba = bd.getElementById("drive-audio");
    ok("the joined file is playable, which is the whole point",
       ba && !ba.paused && isFinite(ba.duration) && ba.duration > 0,
       "paused=" + (ba && ba.paused) + " duration=" + (ba && ba.duration) +
       " status=" + bd.getElementById("drive-status").textContent);
    /*
     * AND IT IS THE RIGHT LENGTH. Chrome will cheerfully play a file with
     * rubbish bytes spliced into it; iOS will not. What both agree on is that
     * such a file is the wrong LENGTH — the rubbish is 4KB where a real chunk
     * is seconds of speech — so the length is how this environment can see the
     * consequence that only his phone can hear.
     */
    ok("and it is as long as all its real pieces, with no rubbish spliced in",
       ba && Math.abs(ba.duration - st.chunks * FAKE_CHUNK_SECONDS) < st.chunks * 0.5,
       "duration=" + (ba && ba.duration ? ba.duration.toFixed(1) : "?") +
       " expected≈" + st.chunks * FAKE_CHUNK_SECONDS);
    ok("and the clock is running rather than stuck at a dash",
       bd.getElementById("drive-remaining").textContent !== "—",
       JSON.stringify(bd.getElementById("drive-remaining").textContent));
    void badServedTwice;
    bd.getElementById("drive-exit").click();
    await wait(200);
  }

  say("DONE");
}

main().catch((e) => { say("FAIL probe threw  -> " + (e && e.stack ? e.stack.split("\n")[0] : e)); say("DONE"); });
</script>
